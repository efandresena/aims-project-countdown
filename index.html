<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graduation Day</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
</head>
  <body>
  <div class="bg-layer" id="bgLayer"></div>
  <canvas id="matrixCanvas"></canvas>

  <div class="main-content">
    <h1 class="title">Graduation Day</h1>
    <p class="subtitle">The Final Countdown — 22 October 2026</p>

    <div class="timer">
      <div class="time-block">
        <span class="time-value" id="days">00</span>
        <span class="time-label">Days</span>
      </div>
      <span class="separator">:</span>
      <div class="time-block">
        <span class="time-value" id="hours">00</span>
        <span class="time-label">Hours</span>
      </div>
      <span class="separator">:</span>
      <div class="time-block">
        <span class="time-value" id="minutes">00</span>
        <span class="time-label">Minutes</span>
      </div>
      <span class="separator">:</span>
      <div class="time-block">
        <span class="time-value" id="seconds">00</span>
        <span class="time-label">Seconds</span>
      </div>
    </div>

    <div class="journey">
      <p class="journey-label">The Road Ahead</p>
      <div class="journey-track" id="journeyTrack">
        <div class="journey-line"></div>
      </div>
      <p class="journey-caption" id="journeyCaption"></p>
    </div>

    <div class="reminder" id="reminder"></div>

    <div class="quotes-container">
      <div class="quote-box" id="motivationalBox">
        <p id="motivationalText"></p>
        <p id="motivationalAuthor"></p>
      </div>
    </div>
  </div>

  <div id="startOverlay" class="start-overlay">
    <div class="start-pulse">🎓 Click anywhere to start 🎓</div>
  </div>

  <audio id="bgMusic" preload="auto" playsinline style="display:none"></audio>

  <div class="audio-panel">
    <input type="range" id="volumeSlider" class="volume" min="0" max="100" value="35" aria-label="Volume" />
    <button id="muteBtn" class="mute-btn" aria-label="Mute or unmute">🔊</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
